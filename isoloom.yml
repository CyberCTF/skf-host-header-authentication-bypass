# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Host Header Authentication Bypass (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask admin panel that trusts the Host header to decide whether a request is local (host header injection). The SKF lab folder python/Host-Header-Authentication-Bypass is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-host-header-authentication-bypass

networks:
  lab: { cidr: 10.60.161.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/static/css/styles.css
    wait: 120
  - name: the login page answers for Host localhost
    script: checks/host.sh

message: |
  OWASP SKF Host Header Authentication Bypass answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The dashboard says it is for local users only. How does the application know where you come from?
