# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Host Header Authentication Bypass (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask admin panel that trusts the Host header to decide whether a request is local (host header injection). The SKF lab folder python/Host-Header-Authentication-Bypass is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-host-header-authentication-bypass

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.161.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build:
        context: app
        dockerfile: app/Dockerfile.lab

checks:
  - name: the lab answers
    http: http://web:5000/static/css/styles.css
    wait: 120
  - name: the login page answers for Host localhost
    script: checks/host.sh

message: |
  OWASP SKF Host Header Authentication Bypass answers at {{ machines.web.ports.web.url }}.
  The dashboard says it is for local users only. How does the application know where you come from?
